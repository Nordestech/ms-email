server:
  port: 8082

spring:
  application:
    name: ms-email
  profiles:
    active: dev

---

spring:
  config:
    activate:
      on-profile: dev
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER}
    password: ${SMTP_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000